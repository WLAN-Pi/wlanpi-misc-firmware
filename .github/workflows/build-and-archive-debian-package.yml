name: Build and Archive Debian Package
on:
  # Allow manual runs of workflow from Actions tab
  workflow_dispatch:

  pull_request:
    paths:
      - 'debian/**'
      - 'lib/**'
      - '.github/workflows/**'

permissions:
  contents: read
  actions: read

jobs:
  sbuild:
    name: sbuild ${{ matrix.distro }}+${{ matrix.arch }}

    runs-on: 'ubuntu-24.04-arm'

    strategy:
      fail-fast: false
      matrix:
        distro: [trixie]
        arch: [arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: sbuild for ${{ matrix.distro }} ${{ matrix.arch }}
        uses: wlan-pi/sbuild-debian-package@70ddba77e3ea21d768b2d29767689cf70c2e08fa # main
        id: build-debian-package
        with:
          distro: ${{ matrix.distro }}
          arch: ${{ matrix.arch }}

      - name: Lintian
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --fail-on error "${{ steps.build-debian-package.outputs.deb-package }}"

      - name: Archive artifacts and upload to GitHub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wlanpi-misc-firmware-${{ matrix.distro }}-${{ matrix.arch }}
          path: ${{ steps.build-debian-package.outputs.deb-package }}

  discord-workflow-status:
    if: ${{ always() && github.repository_owner == 'WLAN-Pi' && ! github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]' }}
    name: Post Workflow Status to Discord
    needs:
      - sbuild
    uses: WLAN-Pi/gh-workflows/.github/workflows/discord-workflow-status.yml@main
    permissions:
      actions: read
      contents: read
    with:
      parent_run_id: ${{ github.run_id }}
    secrets: inherit
